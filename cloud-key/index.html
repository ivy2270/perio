<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牙統資料管理中心</title>
    <script>
        // 盡早讀取診所名稱，避免標題閃爍
        (function() {
            const p = new URLSearchParams(window.location.search);
            if (p.get('clinic_name')) {
                localStorage.setItem('CLINIC_NAME', decodeURIComponent(p.get('clinic_name')));
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tag-pre    { background:#dbeafe; color:#1d4ed8; border:1px solid #bfdbfe; }
        .tag-post   { background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; }
        .tag-plaque { background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
        .tag-91018  { background:#fef3c7; color:#b45309; border:1px solid #fde68a; }
        .tag-other  { background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; }
        .hidden-mode { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-12 font-sans">
    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center relative">
            <button onclick="toggleSettings()" class="absolute right-0 top-0 p-2 text-slate-400 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
            <h1 id="site-title" class="text-4xl font-extrabold text-slate-800 tracking-tight">牙統資料中心</h1>
            <p id="mode-subtitle" class="text-slate-500 mt-3 text-lg">載入中...</p>
        </header>

        <div id="settings-panel" class="hidden mb-8 bg-white p-6 rounded-2xl shadow-lg border border-blue-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">⚙️ 系統連線設定</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">診所名稱</label>
                    <input type="text" id="setup-name" placeholder="例：大安" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">GAS 部署網址 (URL)</label>
                    <input type="text" id="setup-url" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">存取密鑰 (Access Key)</label>
                    <input type="password" id="setup-key" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex gap-2">
                    <button onclick="saveSettings()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">儲存並連線</button>
                    <button onclick="clearSettings()" class="px-4 bg-slate-100 text-slate-400 hover:text-red-500 rounded-xl">清空</button>
                </div>
            </div>
        </div>

        <div id="search-section" class="hidden-mode mb-8">
            <div class="bg-white rounded-2xl shadow-xl p-2 flex flex-col sm:flex-row sm:items-center gap-2 border border-slate-200">
                <input type="text" id="queryInput" placeholder="搜尋姓名或身分證..." class="w-full min-w-0 sm:flex-1 bg-transparent border-none px-4 sm:px-6 py-4 text-base sm:text-lg outline-none" onkeypress="if(event.keyCode==13) searchPatient()">
                <button onclick="searchPatient()" id="searchBtn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 sm:px-8 py-4 rounded-xl font-bold shadow-lg shadow-blue-200 active:scale-95 transition-all whitespace-nowrap">搜尋</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <button onclick="goToForm('perio.html')" class="group bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-emerald-300 transition-all text-center">
                <div class="text-3xl mb-2">🦷</div>
                <div class="font-bold text-slate-700 group-hover:text-emerald-600">牙周囊袋</div>
            </button>
            <button onclick="goToForm('91018.html')" class="group bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-amber-300 transition-all text-center">
                <div class="text-3xl mb-2">📋</div>
                <div class="font-bold text-slate-700 group-hover:text-amber-600">91018 表單</div>
            </button>
            <button onclick="goToForm('plaque.html')" class="group bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-teal-300 transition-all text-center">
                <div class="text-3xl mb-2">✨</div>
                <div class="font-bold text-slate-700 group-hover:text-teal-600">牙菌斑指數</div>
            </button>
        </div>

        <div id="patientList" class="space-y-4"></div>

        <div id="recordPanel" class="hidden">
            <div class="flex items-center justify-between mb-3">
                <h2 id="recordPanelTitle" class="text-xl font-bold text-slate-700"></h2>
                <button onclick="closeRecordPanel()" class="text-blue-500 text-sm underline">← 返回列表</button>
            </div>
            <div id="recordList" class="space-y-3"></div>
        </div>

        <div id="statusMsg" class="hidden text-center py-20 text-slate-400">查無相關紀錄。</div>

        <div id="visitor-hint" class="hidden-mode text-center p-10 border-2 border-dashed border-slate-200 rounded-3xl">
            <p class="text-slate-400">目前為 <span class="font-bold text-slate-600">離線訪客模式</span></p>
        </div>
    </div>

    <script>
        const CONFIG = {
            get url() { return localStorage.getItem('CLINIC_GAS_URL'); },
            get key() { return localStorage.getItem('CLINIC_ACCESS_KEY'); },
            get clinicName() { return localStorage.getItem('CLINIC_NAME'); },
            get isClinicMode() { return !!(this.url && this.key); }
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('setup_url') && urlParams.get('setup_key')) {
                localStorage.setItem('CLINIC_GAS_URL', decodeURIComponent(urlParams.get('setup_url')));
                localStorage.setItem('CLINIC_ACCESS_KEY', decodeURIComponent(urlParams.get('setup_key')));
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            // clinic_name 已在 <head> 的 IIFE 中提前存入 localStorage
            applyClinicName();
            updateUiMode();
        };

        function applyClinicName() {
            const name = CONFIG.clinicName;
            const titleEl = document.getElementById('site-title');
            if (name) {
                titleEl.textContent = name + '牙統資料中心';
                document.title = name + '牙統資料中心';
            }
        }

        function updateUiMode() {
            const subtitle = document.getElementById('mode-subtitle');
            const searchSection = document.getElementById('search-section');
            const visitorHint = document.getElementById('visitor-hint');

            if (CONFIG.isClinicMode) {
                subtitle.innerHTML = `輸入 <span class="font-semibold text-blue-600">姓名</span> 或 <span class="font-semibold text-blue-600">身份證字號</span> 查詢`;
                searchSection.classList.remove('hidden-mode');
                visitorHint.classList.add('hidden-mode');
                // 一進入診所模式，立刻執行空搜尋來獲取最近 20 筆
                searchPatient(""); 
            } else {
                subtitle.innerHTML = `<span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-full text-sm font-bold">訪客模式</span>`;
                searchSection.classList.add('hidden-mode');
                visitorHint.classList.remove('hidden-mode');
            }
        }

        async function searchPatient(forcedQuery) {
            if (!CONFIG.isClinicMode) return;
            const query = (forcedQuery !== undefined) ? forcedQuery : document.getElementById('queryInput').value.trim();
            
            const btn = document.getElementById('searchBtn');
            const patList = document.getElementById('patientList');
            const recPanel = document.getElementById('recordPanel');
            const statusMsg = document.getElementById('statusMsg');

            btn.disabled = true;
            btn.innerHTML = `處理中...`;
            patList.innerHTML = (query === "") ? '<p class="text-center py-10 text-slate-400">正在讀取最近病案...</p>' : '';
            recPanel.classList.add('hidden');
            statusMsg.classList.add('hidden');

            try {
                const resp = await fetch(`${CONFIG.url}?key=${CONFIG.key}&action=search&query=${encodeURIComponent(query)}`);
                const data = await resp.json();

                patList.innerHTML = (query === "" && data.length > 0) ? '<div class="text-sm text-slate-400 mb-2 ml-1">顯示最近更新的 20 位病患：</div>' : '';
                
                if (!data || data.length === 0) {
                    statusMsg.classList.remove('hidden');
                } else {
                    renderPatientList(data);
                }
            } catch (e) {
                patList.innerHTML = '<p class="text-red-400 text-center py-10">連線失敗，請檢查設定。</p>';
            } finally {
                btn.disabled = false;
                btn.innerText = '搜尋';
            }
        }

        // 只保留日期部分（去掉 T16:00:00.000Z 之類的時間），並統一格式
        function formatDate(raw) {
            if (!raw) return '';
            // ISO 字串：取 T 前面的日期部分
            const s = String(raw).trim().split('T')[0];
            // 已是 YYYY-MM-DD 或 YYYY/MM/DD，直接回傳（統一為斜線格式）
            return s.replace(/-/g, '/');
        }

        function renderPatientList(patients) {
            // 依最後更新時間降冪排序；畫面仍顯示手動輸入的紀錄日期
            patients.sort((a, b) => {
                const da = new Date(a.updatedAt || a.date).getTime() || 0;
                const db = new Date(b.updatedAt || b.date).getTime() || 0;
                return db - da;
            });
            const container = document.getElementById('patientList');
            patients.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition-all cursor-pointer flex justify-between items-center group";
                card.onclick = () => loadPatientRecords(p.pid, p.name);
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <span class="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${p.name}</span>
                            <span class="text-sm font-mono bg-slate-100 px-2 py-0.5 rounded text-slate-500">${p.pid}</span>
                        </div>
                        <span class="text-sm text-slate-400">最近紀錄：${formatDate(p.date)} (${p.type})</span>
                    </div>
                    <span class="text-slate-300 group-hover:text-blue-500">→</span>
                `;
                container.appendChild(card);
            });
        }

        async function loadPatientRecords(pid, name) {
            document.getElementById('patientList').innerHTML = '';
            const panel = document.getElementById('recordPanel');
            const list = document.getElementById('recordList');
            document.getElementById('recordPanelTitle').textContent = `${name} 的歷程紀錄`;
            
            list.innerHTML = '<p class="text-center py-10 text-slate-400">載入中...</p>';
            panel.classList.remove('hidden');

            try {
                const resp = await fetch(`${CONFIG.url}?key=${CONFIG.key}&action=getByPid&pid=${encodeURIComponent(pid)}`);
                const records = await resp.json();
                list.innerHTML = '';
                records.forEach(r => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl border border-slate-200 hover:border-blue-300 transition-all cursor-pointer flex justify-between";
                    card.onclick = () => {
                        let url = `${getTargetUrl(r.type)}?rowId=${r.rowId}&setup_url=${encodeURIComponent(CONFIG.url)}&setup_key=${encodeURIComponent(CONFIG.key)}`;
                        window.open(url, '_blank');
                    };
                    card.innerHTML = `<span class="px-3 py-1 rounded-full text-xs font-bold ${getTagClass(r.type)}">${r.type}</span><span class="font-semibold text-slate-700">${formatDate(r.date)}</span>`;
                    list.appendChild(card);
                });
            } catch (e) { list.innerHTML = '載入失敗'; }
        }

        function getTagClass(t) {
            t = String(t || '');
            if (t.includes('術前')) return 'tag-pre';
            if (t.includes('術後')) return 'tag-post';
            if (t.includes('牙菌斑')) return 'tag-plaque';
            if (t.includes('91018')) return 'tag-91018';
            return 'tag-other';
        }

        function getTargetUrl(t) {
            t = String(t || '');
            if (t.includes('牙菌斑')) return 'plaque.html';
            if (t.includes('91018')) return '91018.html';
            return 'perio.html';
        }

        function goToForm(page) {
            let url = page;
            if (CONFIG.isClinicMode) url += `?setup_url=${encodeURIComponent(CONFIG.url)}&setup_key=${encodeURIComponent(CONFIG.key)}`;
            window.open(url, '_blank');
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                document.getElementById('setup-name').value = CONFIG.clinicName || '';
                document.getElementById('setup-url').value  = CONFIG.url  || '';
                document.getElementById('setup-key').value  = CONFIG.key  || '';
            }
        }
        function saveSettings() {
            const name = document.getElementById('setup-name').value.trim();
            if (name) localStorage.setItem('CLINIC_NAME', name);
            else localStorage.removeItem('CLINIC_NAME');
            localStorage.setItem('CLINIC_GAS_URL', document.getElementById('setup-url').value.trim());
            localStorage.setItem('CLINIC_ACCESS_KEY', document.getElementById('setup-key').value.trim());
            location.reload();
        }
        function clearSettings() { if (confirm('重設？')) { localStorage.removeItem('CLINIC_GAS_URL'); localStorage.removeItem('CLINIC_ACCESS_KEY'); localStorage.removeItem('CLINIC_NAME'); location.reload(); } }
        function closeRecordPanel() { document.getElementById('recordPanel').classList.add('hidden'); searchPatient(""); }
    </script>
</body>
</html>
